apiVersion: 1
providers:
  - name: 'federation_core'
    orgId: 1
    folder: 'Federation Core'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards

  - name: 'federation_business'
    orgId: 1
    folder: 'Business'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/business

