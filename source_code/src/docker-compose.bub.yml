# docker-compose.bub.yml
# Fully isolated BU-B stack: own Postgres, own nopCommerce, own auto-installer.
# No shared infrastructure with BU-A - failure in one stack cannot cascade to the other.
#
# Ports:  web -> 5002   postgres -> 5434
# Admin:  http://localhost:5002/admin   admin@bu-b.example.com / ${BUB_ADMIN_PASS}
#
# Start:  docker compose -f docker-compose.bub.yml up -d postgres-bub nopcommerce-bub
# Reset:  BUB_DB_PASS=... BUB_ADMIN_PASS=... BU=b ./scripts/bootstrap/reset-and-install-bu.sh
#
# NOTE: project name 'nop-bub' keeps this stack isolated from nop-bua
#       so 'docker compose ps/down/logs' never shows BU-A containers.
#       Volumes are declared external (src_*) so they survive project renames
#       and are NOT deleted by 'docker compose down -v'. The install script
#       removes them explicitly when REMOVE_VOLUMES=true.

name: nop-bub

services:

  # -- Postgres (BU-B only) -----------------------------------------------------
  postgres-bub:
    image: postgres:15-alpine
    container_name: nopcommerce_bub_postgres
    environment:
      POSTGRES_DB: nopcommerce
      POSTGRES_USER: nopcommerce_bub
      POSTGRES_PASSWORD: ${BUB_DB_PASS}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data-bub:/var/lib/postgresql/data
      - ./scripts/bootstrap/postgres-init-extensions.sh:/docker-entrypoint-initdb.d/01-extensions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopcommerce_bub -d nopcommerce"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
      federation-net:
        aliases:
          - postgres-bub

  # -- nopCommerce web (BU-B) ---------------------------------------------------
  nopcommerce-bub:
    build:
      context: .
      dockerfile: Presentation/Nop.Web/Dockerfile
    image: nop-nopcommerce:latest   # shared tag — same binary as BU-A
    container_name: nopcommerce_bub_web
    depends_on:
      postgres-bub:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80;http://+:5002
      Keycloak__Authority: "http://localhost:8080/realms/nop-federation"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/nop-federation/.well-known/openid-configuration"
      Keycloak__ValidIssuer: "http://localhost:8080/realms/nop-federation"
      Keycloak__ClientId: "bu-b-client"
      Keycloak__ClientSecret: "bu-b-secret"
    ports:
      - "5002:80"
    volumes:
      - ./_appdata-bub:/app/App_Data
      - wwwroot-thumbs-bub:/app/wwwroot/images/thumbs
      - wwwroot-uploaded-bub:/app/wwwroot/images/uploaded
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/favicon.ico"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      default:
      federation-net:

  # -- Auto-installer (one-shot, exits after install) ---------------------------
  nopcommerce-auto-install:
    build:
      context: scripts/bootstrap   # tiny context — only the install script
      dockerfile: auto-install.Dockerfile
    image: nop-auto-install:latest
    container_name: nopcommerce_bub_install
    depends_on:
      nopcommerce-bub:
        condition: service_healthy
    environment:
      NOP_URL: "http://nopcommerce-bub"
      DB_SERVER: "postgres-bub"
      DB_NAME: "nopcommerce"
      DB_USER: "nopcommerce_bub"
      DB_PASS: "${BUB_DB_PASS}"
      ADMIN_EMAIL: "admin@bu-b.example.com"
      ADMIN_PASS: "${BUB_ADMIN_PASS}"
      INSTALL_SAMPLE_DATA: "true"
      DATA_PROVIDER: "PostgreSQL"
    restart: "no"
    networks:
      - default

volumes:
  postgres-data-bub:
    external: true
    name: src_postgres-data-bub
  wwwroot-thumbs-bub:
    external: true
    name: src_wwwroot-thumbs-bub
  wwwroot-uploaded-bub:
    external: true
    name: src_wwwroot-uploaded-bub

networks:
  federation-net:
    external: true
    name: federation-net
